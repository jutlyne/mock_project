services:
  mysql:
    image: mysql:8.0
    container_name: ${APP_NAME:-ruby}_mysql
    restart: unless-stopped
    tty: true
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DATABASE_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DATABASE_NAME}'
      MYSQL_USER: '${DATABASE_USERNAME}'
      MYSQL_PASSWORD: '${DATABASE_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - ./mysql/data:/var/lib/mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max_connections=2213
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-p${DATABASE_PASSWORD}']
      retries: 3
      timeout: 5s
    networks:
      - ruby-network
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
      args:
        RUBY_VERSION: 3.4.4
    image: learn-dev:latest
    container_name: ${APP_NAME:-ruby}-app
    depends_on:
      - mysql
    volumes:
      - .:/rails
    ports:
      - '${APP_PORT:-8080}:3000'
    environment:
      RAILS_ENV: development
      BUNDLE_PATH: '/usr/local/bundle'
      DATABASE_HOST: '${DATABASE_HOST}'
      DATABASE_PORT: 3306
      DATABASE_NAME: '${DATABASE_NAME}'
      DATABASE_USERNAME: '${DATABASE_USERNAME}'
      DATABASE_PASSWORD: '${DATABASE_PASSWORD}'
    command: bash -c "bundle install && bundle exec rails server -b 0.0.0.0 -p 3000"
    user: '${UID:-1000}:${UID:-1000}'
    networks:
      - ruby-network
networks:
  ruby-network:
    driver: bridge